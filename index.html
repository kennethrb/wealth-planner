<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Status Banner -->
  <div id="globalStatus" class="status-banner"></div>

  <main class="container">

    <!-- App Title Header -->
    <header class="hero-header">
      <h1>Wealth Planner</h1>
      <p>Track your budget, cash flow, and financial goals.</p>
    </header>
    
    <!-- Hero Section: Net Worth -->
    <section class="section">
      <div id="networth"></div>
    </section>

    <!-- Dashboard & Projections Grid -->
    <section class="grid-2">
      <div id="dashboard"></div>
      <div id="projection"></div>
    </section>

    <!-- Category Management -->
    <section class="card">
      <h2>🏷️ Manage Categories</h2>
      <div class="form-row">
        <input type="text" id="categoryName" placeholder="Category Name">
        <select id="budgetType">
          <option value="Income">Income</option>
          <option value="Expense">Expense</option>
          <option value="Savings">Savings</option>
          <option value="Debt">Debt</option>
        </select>
        <input type="text" id="categoryGroup" placeholder="Group (e.g. Cash, Bank)">
        <button onclick="addCategory()">Add Category</button>
      </div>

      <hr class="divider">

      <div class="form-row">
        <select id="deleteCategorySelect"></select>
        <button class="btn-danger" onclick="deleteCategory()">Delete Category</button>
      </div>
    </section>

    <!-- Add Budget Item Form -->
    <section class="card">
      <h2>➕ Add Budget Item</h2>
      <div class="form-row">
        <input type="number" id="newYear" value="2027" placeholder="Year">
        <select id="newMonth">
          <option value="Jan">Jan</option>
          <option value="Feb">Feb</option>
          <option value="Mar">Mar</option>
          <option value="Apr">Apr</option>
          <option value="May">May</option>
          <option value="Jun">Jun</option>
          <option value="Jul">Jul</option>
          <option value="Aug">Aug</option>
          <option value="Sep">Sep</option>
          <option value="Oct">Oct</option>
          <option value="Nov">Nov</option>
          <option value="Dec">Dec</option>
        </select>
        <select id="newCategory"></select>
        <input type="number" id="newAmount" placeholder="Amount">
        <button onclick="addBudgetItem()">Add Item</button>
      </div>
    </section>

    <!-- Budget Planner Section -->
    <section class="card">
      <h2>📅 Budget Planner</h2>
      <div class="form-row">
        <select
          id="budgetYear"
          onchange="loadBudgetPlanner()">
        </select>
      </div>
    
      <div id="budget"
           class="table-responsive"></div>
    
    </section>

    <!-- Monthly Summary Section -->
    <section class="card">
      <h2>📊 Monthly Summary</h2>
      <!-- Responsive Scroll Container -->
      <div id="summary" class="table-responsive"></div>
    </section>

    <!-- Scenario Simulator -->
    <section class="card">
      <h2>🔮 Scenario Simulator</h2>
      <div class="form-row">
        <select id="scenarioCategory"></select>
        <input type="number" id="scenarioAmount" placeholder="New Monthly Amount">
        <button onclick="runScenario()">Run Scenario</button>
      </div>
      <div id="scenarioResult" class="margin-top"></div>
    </section>

    <!-- Accounts & Goals Grid -->
    <section class="grid-2">
      <div class="card">
        <div class="card-title">🏦 Accounts</div>
        <div id="accounts"></div>
      </div>
      <div class="card">
        <div class="card-title">🎯 Financial Goals</div>
        <div id="goals"></div>
      </div>
    </section>
    
    <!-- FUNDING BREAKDOWN CARD -->
    <div class="card">
      <div class="card-title">📋 Funding Breakdown</div>
      
      <div class="cash-withdraw-banner">
        <h3>💵 Cash To Withdraw</h3>
        <div class="big-amount" id="cashToWithdraw">₱0.00</div>
      </div>
    
      <div class="card-title" style="margin-top: 16px;">📋 Monthly Funding Plan</div>
      <div class="funding-list" id="fundingPlanList">
        <!-- JS will inject dynamic rows here -->
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
