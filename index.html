<!DOCTYPE html>
<html>

<head>
  <title>Wealth Planner</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <h1>💰 Wealth Planner</h1>

  <div id="globalStatus"></div>

  <div id="networth">
  Loading Net Worth...
  </div>
  
  <hr>

  <div id="projection">
  Loading Wealth Projection...
  </div>

  
  <hr>

  
  
  <div id="dashboard">
  Loading Dashboard...
  </div>

  <hr>

  <h2>🎯 Goals</h2>
  
  <div id="goals">
    Loading Goals...
  </div>
  
  <hr>

  <h2>🏦 Accounts</h2>

  <div id="accounts">
    Loading Accounts...
  </div>


  <hr>

<h2>➕ Add Budget Item</h2>

<div id="addBudgetForm">

  <input
    type="number"
    id="newYear"
    value="2027"
    placeholder="Year"
  >

  <input
    type="text"
    id="newMonth"
    placeholder="Month"
  >

  <input
    type="text"
    id="newCategory"
    placeholder="Category"
  >

  <input
    type="number"
    id="newAmount"
    placeholder="Amount"
  >

  <button onclick="addBudgetItem()">
    ➕ Add
  </button>

  </div>

  <hr>

<h2>🏷️ Category Manager</h2>

<div id="categoryForm">

  <input
    type="text"
    id="categoryName"
    placeholder="Category Name"
  >

  <select id="budgetType">

    <option value="Income">
      Income
    </option>

    <option value="Expense">
      Expense
    </option>

    <option value="Savings">
      Savings
    </option>

    <option value="Debt">
      Debt
    </option>

  </select>

  <input
    type="text"
    id="categoryGroup"
    placeholder="Group"
  >

  <button onclick="addCategory()">
    ➕ Add Category
  </button>

</div>
  
  <hr>

  <h2>📅 Budget Planner</h2>

  <div id="budget">
    Loading Budget...
  </div>

  <hr>

  <h2>📊 Monthly Summary</h2>
  
  <div id="summary">
    Loading Summary...
  </div>


  <script src="app.js"></script>

</body>

</html>
